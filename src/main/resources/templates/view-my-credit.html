<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>مشاهده اعتبار</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #fce4ec);
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 40px;
            font-size: 26px;
        }

        form {
            background-color: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 30px auto;
            direction: rtl;
            transition: all 0.3s ease;
        }

        label {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            display: block;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #43a047;
        }

        .request-list {
            max-width: 500px;
            margin: 0 auto 40px auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            direction: rtl;
        }

        .request-item {
            padding: 15px 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .request-item:last-child {
            border-bottom: none;
        }

        .request-item strong {
            color: #555;
        }

        .request-item span {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>مشاهده اعتبار </h2>

<div th:if="${credit != null}" class="request-list">
    <div th:each="credit : ${credit}" class="request-item">
        <p><strong>شماره اعتبار:</strong> <span th:text="${credit.id}"></span></p>
        <p><strong>مبلغ:</strong> <span th:text="${credit.balance}"></span></p>
    </div>
</div>

</body>
</html>
