<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پروفایل مشتری</title>
    <style>
        .sidebar {
            width: 220px;
            background: rgb(255, 196, 230);
            padding: 20px;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }


        .sidebar form button {
            background: linear-gradient(135deg, #d81b60, #f06292);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            margin-bottom: 10px;
        }

        .sidebar form button:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #c2185b, #ad1457);
        }

        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            direction: rtl;
            background-color: #f8bbd0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #d81b60;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <form th:action="@{/all-requests}" method="get">
        <input hidden="hidden" type="number" name="userIdCredit" th:value="${reviewDto.customerId}" >
        <button type="submit">لیست همه درخواست‌ها</button>
    </form>
