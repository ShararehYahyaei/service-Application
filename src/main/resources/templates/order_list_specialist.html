<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order List</title>
    <style>
        /* استایل‌ها */
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            background-color: #f4f7fb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 30px;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #d81b60;
            font-size: 28px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f06292;
            color: white;
            font-size: 18px;
        }

        td {
            font-size: 16px;
            color: #555;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        button {
            padding: 8px 16px;
            background-color: #d81b60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #c2185b;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Orders of Customer</h1>
    <table>
        <thead>
        <tr>
            <th>شناسه سفارش</th>
            <th> شناسه پیشنهاد</th>
            <th>وضعیت</th>
            <th>عملیات</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${allOrdersForSpecialist}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.customerId}"></td>
            <td th:text="${order.customerRequestId}"></td>
            <td th:text="${order.offerId}"></td>
            <td th:text="${order.status}"></td>
            <td>
                <p>وضعیت سفارش: <span th:text="${order.status()}"></span></p>
                <form th:action="@{/update-order-status}" method="get">
                    <input type="hidden" name="customerId" th:value="${order.customerId}" />
                    <input type="hidden" name="status" th:value="${order.status}" />
                    <input type="hidden" name="orderId" th:value="${order.orderId}" />
                        <input hidden="hidden" type="number" name="orderId" th:value="${order.orderId}" >
                        <button type="submit">تغییر وضعیت</button>
                    </button>

                </form>

            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
