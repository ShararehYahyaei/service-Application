<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پروفایل متخصص</title>
    <style>
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .profile-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        .profile-container h2 {
            color: #444;
        }

        .profile-container p {
            color: #666;
            font-size: 16px;
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }

        .back-button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .back-button:hover {
            background: linear-gradient(135deg, #ff5178, #ff6a9f);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<h1>پروفایل متخصص</h1>


<p th:if="${error}" class="error-message" th:text="${error}"></p>


<div class="profile-container" th:if="${specialist}">
    <h2>اطلاعات متخصص</h2>
    <p><strong>نام:</strong> <span th:text="${specialist.name}"></span></p>
    <p><strong>ایمیل:</strong> <span th:text="${specialist.email}"></span></p>
</div>


<a href="/services" class="back-button">بازگشت</a>


</body>
</html>
