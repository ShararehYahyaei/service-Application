<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لیست متخصصان</title>
    <style>
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #e1bee7);
            padding: 20px;
            direction: rtl;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #f2f2f2;
        }
        tr:nth-child(even) {
            background: #fafafa;
        }
        .add-subservice-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
        .add-subservice-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<h2>لیست متخصصان</h2>
<form th:action="@{/all-specialists}"  method="get" class="space-y-4">
    <div>
        <label for="fromLocalDate">تاریخ از:</label>
        <input type="date" id="fromLocalDate" name="fromLocalDate" th:value="${fromLocalDate}" />
    </div>
    <div>
        <label for="toLocalDate">تاریخ تا:</label>
        <input type="date" id="toLocalDate"   name="toLocalDate" th:value="${toLocalDate}" />
    </div>
    <div class="text-center">
        <button type="submit"
                class="back-button">جستجو</button>
    </div>
</form>

<table>
    <thead>
    <tr>
        <th>نام</th>
        <th>تلفن</th>
        <th>آدرس</th>
        <th>فعال</th>
        <th>نقش</th>
        <th>وضعیت</th>
<!--        <th>عملیات</th>-->
    </tr>
    </thead>
    <tbody>
    <tr th:each="specialist : ${specialists}">
        <td th:text="${specialist.name}"></td>
        <td th:text="${specialist.phone}"></td>
        <td th:text="${specialist.address}"></td>
        <td th:text="${specialist.active ? 'بله' : 'خیر'}"></td>
        <td th:text="${specialist.role}"></td>
        <td th:text="${specialist.status}"></td>
        <td th:text="${specialist.status}"></td>
<!--        <td>-->

<!--            <form th:action="@{/add-subservice}" method="post">-->
<!--                <input hidden="hidden" type="number"  name="specialistId" th:value="${specialist.specialistId}" >-->
<!--                <button type="submit" class="add-subservice-btn">افزودن زیر خدمت</button>-->
<!--            </form>-->
<!--        </td>-->
    </tr>
    </tbody>
</table>
</body>
</html>
