<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ارسال پیشنهاد</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
            color: #495057;
        }

        .container {
            max-width: 600px;
            margin-top: 50px;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            color: #007bff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
        }

        label {
            font-weight: bold;
            color: #343a40;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            background-color: #28a745;
            border: none;
            color: white;
            font-weight: 600;
        }

        button:hover {
            background-color: #218838;
            cursor: pointer;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .alert {
            margin-top: 20px;
            border-radius: 10px;
        }

    </style>
</head>
<body>
<div class="container">
    <h2>ارسال پیشنهاد</h2>
    <!-- اگر پیام موفقیت یا خطا باشد، نمایش داده می‌شود -->
    <div th:if="${success}" class="alert alert-success">
        <strong>موفقیت!</strong> پیشنهاد شما با موفقیت ثبت شد.
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <strong>خطا!</strong> مشکلی در ارسال پیشنهاد پیش آمده است.
    </div>

    <!-- فرم ارسال پیشنهاد -->
    <form th:action="@{/addOffer/{customerRequestId}(customerRequestId=${customerRequestId})}" th:object="${offerDto}" method="post">

        <div class="form-group">
            <label for="specialistId">کد متخصص:</label>
            <input type="number" id="specialistId" th:field="*{specialistId}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="offerPrice">قیمت پیشنهاد:</label>
            <input type="number" id="offerPrice" th:field="*{offerPrice}" class="form-control" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="offerDate">تاریخ پیشنهاد:</label>
            <input type="date" id="offerDate" th:field="*{offerDate}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="estimationTime">زمان تخمینی (ساعت):</label>
            <input type="number" id="estimationTime" th:field="*{estimationTime}" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="rate">امتیاز:</label>
            <input type="number" id="rate" th:field="*{rate}" class="form-control" step="0.1">
        </div>

        <button type="submit">ارسال پیشنهاد</button>
    </form>
</div>
</body>
</html>
