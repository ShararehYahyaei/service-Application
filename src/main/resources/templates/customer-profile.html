<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پروفایل مشتری</title>
    <style>
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            direction: rtl;
            background-color: #f8bbd0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, textarea, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #d81b60;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ثبت نظر</h2>
    <form action="/giveReview" method="post">
        <label for="customerId">شناسه مشتری:</label>
        <input type="number" id="customerId" name="customerId" required>

        <label for="userId">شناسه کاربر:</label>
        <input type="number" id="userId" name="userId" required>

        <label for="orderId">شناسه متخصص:</label>
        <input type="number" id="orderId" name="orderId" required>

        <label for="rating">امتیاز:</label>
        <input type="number" id="rating" name="rating" min="1" max="5" required>

        <label for="comment">نظر:</label>
        <textarea id="comment" name="comment" rows="4" required></textarea>

        <button type="submit">ارسال نظر</button>
    </form>
</div>

</body>
</html>
