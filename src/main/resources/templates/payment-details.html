<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>پرداخت با کارت</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

<div class="max-w-2xl mx-auto p-8 bg-white rounded-lg shadow-lg mt-12">
    <h2 class="text-3xl font-semibold text-center text-blue-600 mb-6">جزئیات کارت انتخابی</h2>

    <div class="mb-6">
        <p class="text-lg font-medium text-gray-700">شماره کارت: <span th:text="${card.cardNumber}" class="text-blue-600 font-bold"></span></p>
        <p class="text-lg font-medium text-gray-700">موجودی کارت: <span th:text="${card.balance}"
                                                                           class="text-green-600 font-bold"></span></p>
    </div>

    <form th:action="@{/process-payment}" method="post">
        <div class="mb-4">
            <label for="cvv" class="block text-lg font-medium text-gray-700 mb-2">CVV:</label>
            <input type="text" id="cvv" name="cvv" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2
                    focus:ring-blue-500 focus:border-blue-500"/>
        </div>

        <div class="mb-4">
            <label for="cvv" class="block text-lg font-medium text-gray-700 mb-2">تاریخ انقضا:</label>
            <input type="text" id="expiryDate" name="expiryDate" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2
                   focus:ring-blue-500 focus:border-blue-500"/>
        </div>

        <div class="mb-4">
            <label for="cvv" class="block text-lg font-medium text-gray-700 mb-2">کد امنیتی:</label>
            <input type="text" id="captcha" name="captcha" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2
                   focus:ring-blue-500 focus:border-blue-500"/>
            <img src="/captcha/image" alt="captcha"><br>
        </div>

        <input type="hidden" name="cardId" th:value="${card.cardId}"/>
        <input type="hidden" name="customerId" th:value="${customerId}"/>
        <input type="hidden" name="orderId" th:value="${orderId}" />
        <div class="flex justify-center mt-6">
            <button type="submit"
                    class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                پرداخت
            </button>
        </div>
    </form>
</div>

</body>
</html>
