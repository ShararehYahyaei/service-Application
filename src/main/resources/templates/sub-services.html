<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لیست زیرخدمات</title>
    <style>
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #e1bee7);
            padding: 20px;
            direction: rtl;
        }
        h2 {
            text-align: center;
        }
        .service-list {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
        }
        .service-item {
            background: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
        }
        .back-btn {
            display: inline-block;
            margin: 20px 0;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<h2>لیست زیرخدمات</h2>

<ul class="service-list">
    <li class="service-item" th:each="service : ${allSubServices}">
        <h3 th:text="${service.name}"></h3>
        <p><span>کد خدمت:</span> <span th:text="${service.id}"></span></p>
        <p><span>توضیحات:</span> <span th:text="${service.description}"></span></p>
        <p><span>قیمت:</span> <span th:text="${service.price}"></span> تومان</p>
    </li>
</ul>

<a href="/services" class="back-btn">بازگشت به صفحه اصلی</a>

</body>
</html>
