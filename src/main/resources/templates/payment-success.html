<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>نتیجه پرداخت</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

<div class="max-w-2xl mx-auto p-8 bg-white rounded-lg shadow-lg mt-12">
    <h2 class="text-3xl font-semibold text-center text-blue-600 mb-6">نتیجه پرداخت</h2>

    <div class="mb-6">
        <p th:text="${message}" class="text-xl text-center text-gray-700 font-medium"></p>
    </div>

    <div class="flex justify-center mt-6">
        <a href="/payment" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
            بازگشت به صفحه پرداخت
        </a>
    </div>
</div>

</body>
</html>
