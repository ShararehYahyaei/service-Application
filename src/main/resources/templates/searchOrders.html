<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتایج جستجو</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-blue-50 to-green-50 min-h-screen font-sans">

<div class="max-w-4xl mx-auto my-12 p-8 bg-white shadow-xl rounded-2xl">
    <h1 class="text-4xl font-extrabold text-center text-blue-700 mb-10">نتایج جستجوی خدمات انجام شده</h1>

    <form th:action="@{/searchOrders}" th:object="${orderDtoSearch}" method="get" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="fromLocalDate" class="block text-sm font-medium text-gray-700 mb-1">تاریخ از:</label>
                <input type="date" id="fromLocalDate" name="fromLocalDate"
                       th:field="*{fromLocalDate}"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            </div>
            <div>
                <label for="toLocalDate" class="block text-sm font-medium text-gray-700 mb-1">تاریخ تا:</label>
                <input type="date" id="toLocalDate" name="toLocalDate"
                       th:field="*{toLocalDate}"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"/>
            </div>
        </div>

        <div>
            <label for="orderStatus" class="block text-sm font-medium text-gray-700 mb-1">وضعیت:</label>
            <input type="text" id="orderStatus" name="orderStatus"
                   th:field="*{orderStatus}"
                   class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400"/>
        </div>

        <div>
            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">نام خدمت:</label>
            <input type="text" id="category" name="category"
                   th:field="*{category}"
                   class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"/>
        </div>

        <div>
            <label for="subService" class="block text-sm font-medium text-gray-700 mb-1">نام زیرخدمت:</label>
            <input type="text" id="subService" name="subService"
                   th:field="*{subService}"
                   class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400"/>
        </div>

        <div class="text-center">
            <button type="submit"
                    class="mt-6 py-3 px-8 bg-gradient-to-r from-blue-500 to-green-400 text-white font-bold rounded-xl hover:from-blue-600 hover:to-green-500 transition duration-300">
                جستجو
            </button>
        </div>
    </form>

    <div class="mt-12">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2 border-gray-200">نتایج جستجو:</h2>
        <ul class="space-y-4">
            <li th:each="order : ${orders}" class="p-4 bg-blue-50 border border-blue-100 rounded-xl shadow-sm hover:bg-blue-100 transition">
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm text-gray-700 font-medium">
                    <span><strong>کد سفارش:</strong> <span th:text="${order.orderId}"></span></span>
                    <span><strong>کد پیشنهاد:</strong> <span th:text="${order.offerId}"></span></span>
                    <span><strong>وضعیت:</strong> <span th:text="${order.status}"></span></span>
                    <span><strong>تاریخ:</strong> <span th:text="${order.orderDate}"></span></span>
                    <span><strong>قیمت:</strong> <span th:text="${order.offerPrice()}"></span></span>
                </div>
            </li>
        </ul>
    </div>

    <div class="mt-8 text-center">
        <a href="get-Profile-Admin"
           class="inline-block mt-4 px-6 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition">
            بازگشت به صفحه قبل
        </a>
    </div>
</div>

</body>
</html>
