<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>افزودن اعتبار</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f7f7f7;
            padding: 30px;
        }

        .form-container {
            background-color: #fff;
            padding: 25px 40px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        .message {
            margin-top: 20px;
            text-align: center;
            color: #28a745;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>افزودن اعتبار به حساب</h2>
    <form th:action="@{/addCredit}" th:object="${creditForm}" method="post">
        <label for="role">نقش:</label>
        <select id="role" name="role" required>
            <option value="">انتخاب کنید</option>
            <option value="CUSTOMER">مشتری</option>
        </select>

        <label for="userId">شناسه کاربر:</label>
        <input type="number" id="userId" th:field="*{userId}"  name="userId"    />

        <label for="balance">مقدار اعتبار (تومان):</label>
        <input type="number" th:field="*{balance}" step="0.01" name="balance" id="balance" />
        <button type="submit">افزودن</button>
    </form>

    <div class="message" th:if="${message != null}">
        <p th:text="${message}"></p>
    </div>
</div>
</body>
</html>
