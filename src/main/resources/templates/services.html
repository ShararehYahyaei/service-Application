<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>لیست خدمات</title>
    <style>
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            background: rgba(255, 182, 193, 0.5) url('/image/ChatGPT Image Mar 31, 2025, 11_57_12 PM.png') no-repeat center center fixed;
            background-size: contain;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            direction: rtl;
        }

        .sidebar {
            width: 220px;
            background: rgb(255, 196, 230);
            padding: 20px;
            box-shadow: -4px 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }


        .sidebar form button {
            background: linear-gradient(135deg, #d81b60, #f06292);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            margin-bottom: 10px;
        }

        .sidebar form button:hover {
            transform: translateY(-5px);
            background: linear-gradient(135deg, #c2185b, #ad1457);
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .service-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .category-item {
            background: linear-gradient(135deg, #f8bbd0, #f48fb1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            margin-bottom: 25px;
        }

        .category-item h3 {
            font-size: 24px;
            color: black;
            margin-bottom: 10px;
        }

        .service-item {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 15px 0;
        }

        .service-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .service-item h3 {
            margin-top: 0;
            font-size: 20px;
            color: black;
            margin-bottom: 10px;
        }

        .service-item p {
            margin: 12px 0;
            color: black;
            font-size: 14px;
        }

        .service-item span:first-child {
            font-weight: bold;
            color: black;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <form th:action="@{/categoriesListPage}" method="get">
        <button type="submit">لیست دسته‌بندی‌ها</button>
    </form>

    <form th:action="@{/servicesList}" method="get">
        <button type="submit">لیست خدمات</button>
    </form>

    <form th:action="@{/register}" method="get">
        <button type="submit">ثبت‌نام</button>
    </form>


    <form th:action="@{/getProfile}" method="get">
        <button type="submit">  پروفایل متخصص</button>
    </form>

    <form th:action="@{/getCustomerId}" method="get">
        <button type="submit">پروفایل </button>
    </form>

    <form th:action="@{/get-Profile-Admin}" method="get">
        <button type="submit"> کارتابل ادمین </button>
    </form>



</div>

<div class="main-content">
    <ul class="service-list" th:if="${showList}">
        <li class="category-item" th:each="entry : ${subCategories}">
            <h3 th:text="${entry.key}">نام دسته‌بندی</h3>
            <ul>
                <li class="service-item" th:each="service : ${entry.value}">
                    <h3 th:text="${service.name}"></h3>
                    <p><span>کد خدمت:</span> <span th:text="${service.id}"></span></p>
                    <p><span>توضیحات:</span> <span th:text="${service.description}"></span></p>
                    <p><span>قیمت:</span> <span th:text="${service.price}"></span> تومان</p>

                </li>
                <form th:action="@{/add-sub-service/{categoryId}(categoryId=${entry.key})}" method="get">
                    <button type="submit">افزودن زیر خدمت جدید</button>
                </form>
            </ul>
        </li>
    </ul>
</div>

</body>

</html>
