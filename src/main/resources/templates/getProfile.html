<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>پروفایل متخصص</title>
    <style>
        body {
            font-family: 'Vazirmatn', Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        label {
            font-size: 16px;
            color: #555;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #ff5178, #ff6a9f);
            transform: translateY(-2px);
        }

        .error-message {
            color: red;
            margin-top: 10px;
        }

        .profile-container {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        .profile-container h2 {
            color: #444;
        }

        .profile-container p {
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h1>جستجوی متخصص</h1>

<div id="searchFormContainer" >
    <form th:action="@{/specialist-profile}" method="get">
        <label for="specialistId">شماره متخصص:</label>
        <input type="number" id="specialistId" name="specialistId" required>
        <button type="submit">جستجو</button>
    </form>
</div>

<a href="/services" class="back-button"
   style="padding: 10px 15px; background: #ff69b4; color: white;
    text-decoration: none; border-radius: 5px; display: inline-block;">بازگشت</a>



</body>
</html>
